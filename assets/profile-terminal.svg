    <text x="264" y="446" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="9.5" fill="#333a44">ascii://portrait</text>

    <!-- right side: terminal output -->
    <g font-family="SFMono-Regular, Consolas, Menlo, monospace">
      <text x="560" y="96" font-size="15" fill="#5fd68a">$ <tspan fill="#6cb6ff">whoami</tspan></text>
      <text x="560" y="122" font-size="18" font-weight="600" fill="#e6edf3">Muhammad Ahmed</text>

      <text x="560" y="164" font-size="15" fill="#5fd68a">$ <tspan fill="#6cb6ff">role</tspan></text>
      <text x="560" y="190" font-size="15" fill="#c9d1d9">Aspiring Full-Stack Developer</text>

      <text x="560" y="232" font-size="15" fill="#5fd68a">$ <tspan fill="#6cb6ff">focus</tspan></text>
      <text x="560" y="258" font-size="15" fill="#c9d1d9">Frontend <tspan fill="#f0883e">→</tspan> Full-Stack</text>

      <text x="560" y="300" font-size="15" fill="#5fd68a">$ <tspan fill="#6cb6ff">stack</tspan></text>
      <text x="560" y="326" font-size="13.5" fill="#c9d1d9">React <tspan fill="#3a4048">·</tspan> JavaScript <tspan fill="#3a4048">·</tspan> Tailwind CSS <tspan fill="#3a4048">·</tspan> Bootstrap</text>

      <text x="560" y="368" font-size="15" fill="#5fd68a">$ <tspan fill="#6cb6ff">learning</tspan></text>
      <text x="560" y="394" font-size="13.5" fill="#c9d1d9">TypeScript <tspan fill="#3a4048">·</tspan> Next.js <tspan fill="#3a4048">·</tspan> Node.js <tspan fill="#3a4048">·</tspan> Prisma</text>

      <text x="560" y="436" font-size="15" fill="#5fd68a">$ <tspan fill="#6cb6ff">status</tspan></text>
      <text x="560" y="461" font-size="15" font-weight="600" fill="#3fdc6b">&#9679; BUILDING</text>

      <text x="560" y="461" font-size="15" fill="#3fdc6b" dx="118">&#9612;</text>
    </g>

    <text x="1156" y="465" text-anchor="end" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-style="italic" font-size="11" fill="#3a4048">// Building the Web, One Idea at a Time.</text>
  </g>

  <rect x="1" y="1" width="1178" height="478" rx="10" ry="10" fill="none" stroke="#262b33" stroke-width="1"/>
</svg>
