<svg width="1180" height="480" viewBox="0 0 1180 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Ahmed — developer terminal profile</title>
  <desc id="desc">Terminal-style panel: an ASCII-rendered portrait on the left, developer identity printed as shell output on the right.</desc>

  <defs>
    <clipPath id="frameClip">
      <rect x="1" y="1" width="1178" height="478" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect x="0" y="0" width="1180" height="480" fill="#0a0d12"/>

    <!-- title bar -->
    <rect x="0" y="0" width="1180" height="34" fill="#10141b"/>
    <circle cx="20" cy="17" r="5" fill="#ff5f56"/>
    <circle cx="38" cy="17" r="5" fill="#ffbd2e"/>
    <circle cx="56" cy="17" r="5" fill="#27c93f"/>
    <text x="82" y="21" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="12" fill="#6e7681">ahmed@dev — ~/portfolio</text>
    <text x="1098" y="21" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="11" fill="#3a4048">zsh</text>

    <!-- divider -->
    <line x1="528" y1="34" x2="528" y2="480" stroke="#20242c" stroke-width="1"/>

    <!-- portrait panel -->
    <rect x="24" y="56" width="480" height="396" rx="6" ry="6" fill="#05070a" stroke="#20242c" stroke-width="1"/>

    <!-- corner reticle marks -->
    <g stroke="#3fb6c9" stroke-width="2" fill="none">
      <path d="M40 74 v-10 h10"/>
      <path d="M488 74 v-10 h-10"/>
      <path d="M40 434 v10 h10"/>
      <path d="M488 434 v10 h-10"/>
    </g>

    <!-- ascii portrait, density-mapped from the supplied source photo (99x43 char grid) -->
